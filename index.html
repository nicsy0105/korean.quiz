<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국어의 어제와 오늘 · 복습 퀴즈</title>
<meta name="description" content="중세 국어의 특징부터 오늘날의 국어생활까지 점검하는 10문항 복습 퀴즈">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17212b;
    --ink-soft:#4d5764;
    --ink-faint:#8b939c;
    --paper:#eae8e1;
    --card:#f7f6f2;
    --line:#d5d2c7;
    --jusa:#9e2b25;
    --jjok:#2f5480;
    --serif:"Gowun Batang", serif;
    --sans:"Noto Sans KR", system-ui, sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    word-break:keep-all;
  }

  .wrap{
    max-width:36rem;
    margin:0 auto;
    padding:2.25rem 1.25rem 4rem;
  }

  .screen{display:none}
  .screen.on{display:block}

  /* ── 표지 ─────────────────────────── */
  .cover-mark{
    font-family:var(--serif);
    font-size:2.9rem;
    line-height:1.35;
    letter-spacing:.04em;
    writing-mode:vertical-rl;
    height:6.6rem;
    margin:0 0 1.75rem;
    color:var(--ink);
  }
  .cover-mark b{font-weight:400;color:var(--jusa)}

  h1{
    font-family:var(--serif);
    font-size:1.75rem;
    font-weight:700;
    line-height:1.45;
    margin:0 0 .5rem;
    letter-spacing:-.01em;
  }
  .cover p{
    color:var(--ink-soft);
    margin:0 0 1.75rem;
    font-size:.95rem;
  }

  .meta{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:.9rem 0;
    margin-bottom:1.75rem;
    display:flex;
    gap:1.75rem;
    font-size:.85rem;
    color:var(--ink-soft);
  }
  .meta span b{
    display:block;
    font-family:var(--serif);
    font-size:1.3rem;
    color:var(--ink);
    font-weight:700;
    line-height:1.3;
  }

  label{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:.4rem}
  input[type=text]{
    width:100%;
    font-family:var(--sans);
    font-size:1rem;
    padding:.7rem .85rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:var(--ink);
    margin-bottom:1.5rem;
  }
  input[type=text]:focus{outline:2px solid var(--jjok);outline-offset:1px;border-color:transparent}

  button{
    font-family:var(--sans);
    font-size:1rem;
    cursor:pointer;
    border-radius:2px;
  }

  .primary{
    width:100%;
    background:var(--ink);
    color:var(--card);
    border:none;
    padding:.95rem;
    font-weight:500;
    letter-spacing:.02em;
  }
  .primary:disabled{background:var(--line);color:#fff;cursor:default}
  .primary:focus-visible{outline:2px solid var(--jusa);outline-offset:2px}

  /* ── 방점 진행 표시 ────────────────── */
  .rail{
    display:flex;
    gap:.45rem;
    align-items:center;
    margin-bottom:2rem;
  }
  .rail i{
    width:7px;height:7px;
    border-radius:50%;
    border:1px solid var(--ink-faint);
    display:block;
    transition:background-color .2s, border-color .2s, transform .2s;
  }
  .rail i.done{background:var(--ink);border-color:var(--ink)}
  .rail i.miss{background:transparent;border-color:var(--jusa);border-width:2px}
  .rail i.now{background:var(--jusa);border-color:var(--jusa);transform:scale(1.45)}
  .rail em{
    margin-left:auto;
    font-style:normal;
    font-size:.8rem;
    color:var(--ink-faint);
    letter-spacing:.05em;
  }

  /* ── 문항 ─────────────────────────── */
  .q{
    font-family:var(--serif);
    font-size:1.3rem;
    font-weight:700;
    line-height:1.6;
    margin:0 0 1.5rem;
    padding-left:1rem;
    position:relative;
  }
  .q::before{
    content:"·";
    position:absolute;
    left:0;top:-.05em;
    color:var(--jusa);
    font-size:1.6rem;
    line-height:1;
  }

  .opts{display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.25rem}
  .opt{
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    padding:.85rem 1rem .85rem 2.1rem;
    line-height:1.6;
    position:relative;
    transition:border-color .15s, background-color .15s;
  }
  .opt::before{
    content:"";
    position:absolute;
    left:.9rem;top:1.28rem;
    width:6px;height:6px;border-radius:50%;
    background:transparent;
    transition:background-color .15s;
  }
  .opt:hover{border-color:var(--ink-faint)}
  .opt.pick{border-color:var(--ink)}
  .opt.pick::before{background:var(--jusa)}
  .opt:focus-visible{outline:2px solid var(--jjok);outline-offset:1px}
  .opt.right{border-color:var(--jjok);background:#eaf0f7}
  .opt.right::before{background:var(--jjok)}
  .opt.wrong{border-color:var(--jusa);background:#f7eceb}
  .opt.wrong::before{background:var(--jusa)}
  .opts.locked .opt{cursor:default}

  .hint-btn{
    background:none;border:none;
    color:var(--ink-soft);
    font-size:.85rem;
    padding:0 0 1.25rem;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .hint{
    font-size:.9rem;
    color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding:.15rem 0 .15rem .8rem;
    margin:0 0 1.25rem;
  }

  .verdict{
    border-top:1px solid var(--line);
    padding-top:1.1rem;
    margin-bottom:1.5rem;
  }
  .verdict h2{
    font-family:var(--serif);
    font-size:1.05rem;
    margin:0 0 .4rem;
    font-weight:700;
  }
  .verdict.o h2{color:var(--jjok)}
  .verdict.x h2{color:var(--jusa)}
  .verdict p{margin:0;font-size:.95rem;color:var(--ink-soft)}

  /* ── 결과 ─────────────────────────── */
  .score{
    font-family:var(--serif);
    font-size:4.5rem;
    font-weight:700;
    line-height:1;
    margin:.5rem 0 .25rem;
    letter-spacing:-.02em;
  }
  .score small{font-size:1.5rem;color:var(--ink-faint);font-weight:400}
  .score-note{color:var(--ink-soft);margin:0 0 2rem;font-size:.95rem}

  .review{border-top:1px solid var(--line)}
  .review details{border-bottom:1px solid var(--line)}
  .review summary{
    padding:.8rem 0 .8rem 1.6rem;
    cursor:pointer;
    position:relative;
    font-size:.95rem;
    list-style:none;
  }
  .review summary::-webkit-details-marker{display:none}
  .review summary::before{
    content:"";
    position:absolute;left:.35rem;top:1.35rem;
    width:7px;height:7px;border-radius:50%;
  }
  .review .o summary::before{background:var(--ink)}
  .review .x summary::before{background:var(--jusa)}
  .review .x summary{color:var(--jusa)}
  .review .body{
    padding:0 0 1rem 1.6rem;
    font-size:.9rem;
    color:var(--ink-soft);
  }
  .review .body b{color:var(--ink);font-weight:500}

  .actions{display:flex;gap:.55rem;margin-top:2rem}
  .ghost{
    flex:1;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:.85rem;
  }
  .ghost:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}

  footer{
    margin-top:3rem;
    padding-top:1rem;
    border-top:1px solid var(--line);
    font-size:.78rem;
    color:var(--ink-faint);
    line-height:1.6;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 표지 -->
  <section id="cover" class="screen on cover">
    <div class="cover-mark">국어의<br><b>어제</b>와 오늘</div>
    <h1>변화하는 국어의 모습</h1>
    <p>중세 국어의 표기·음운·어휘·문법부터 오늘날의 국어생활까지, 한 소단원을 10문항으로 점검합니다.</p>

    <div class="meta">
      <span>문항<b>10</b></span>
      <span>배점<b>100</b></span>
      <span>예상 시간<b>8분</b></span>
    </div>

    <label for="name">이름 (결과 제출용, 생략 가능)</label>
    <input type="text" id="name" placeholder="예) 김민서" autocomplete="off">

    <button class="primary" id="start">퀴즈 시작</button>

    <footer>
      한 문항을 풀 때마다 정답과 해설이 바로 나옵니다. 마지막 화면에서 결과 요약을 복사해 제출하세요.
    </footer>
  </section>

  <!-- 문항 -->
  <section id="quiz" class="screen">
    <div class="rail" id="rail"></div>
    <p class="q" id="prompt"></p>
    <div class="opts" id="opts"></div>
    <button class="hint-btn" id="hintBtn">힌트 보기</button>
    <p class="hint" id="hint" hidden></p>
    <div class="verdict" id="verdict" hidden>
      <h2 id="verdictTitle"></h2>
      <p id="verdictText"></p>
    </div>
    <button class="primary" id="next" disabled>답 확인</button>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen">
    <p class="score-note" id="who"></p>
    <div class="score"><span id="scoreNum">0</span><small>/100</small></div>
    <p class="score-note" id="summary"></p>
    <div class="review" id="review"></div>
    <div class="actions">
      <button class="ghost" id="copy">결과 복사</button>
      <button class="ghost" id="again">다시 풀기</button>
    </div>
    <footer id="copyNote">복사한 결과를 수업 단톡방에 붙여넣어 제출하세요.</footer>
  </section>

</div>

    answer: 0,
    hint: "'해동 육룡이 나시어'로 시작하는 작품입니다.",
    why: "용비어천가는 세종 29년(1447)에 간행된 악장으로, 훈민정음으로 기록된 최초의 작품입니다. 세종의 명으로 정인지, 권제, 안지 등이 지었으며 선조들의 공덕을 기리고 조선 개국의 정당성을 밝히고 있습니다.",
    tag: "중세 국어 자료"
  },
  {
    q: "국립국어원에서 제시한 '드라이브 스루(drive-through)'의 다듬은 말은 무엇일까요?",
    options: ["승차 구매", "포장 구매", "맞춤 색상", "개봉(기)"],
    answer: 0,
    hint: "차에서 내리지 않고 물건을 사는 방식을 떠올려 보세요.",
    why: "'드라이브 스루'는 '승차 구매'로 다듬었습니다. '테이크 아웃'은 '포장 구매', '퍼스널 컬러'는 '맞춤 색상', '언박싱'은 '개봉(기)'입니다.",
    tag: "오늘날의 국어생활"
  }
];

/* ────────────────────────────────────────────────
   보기 순서를 학생마다 섞을지 여부
   false 로 바꾸면 위에 적은 순서 그대로 나옵니다.
   ──────────────────────────────────────────────── */
const SHUFFLE = true;

const $ = id => document.getElementById(id);
let deck = [], idx = 0, picked = null, locked = false, log = [], t0 = 0, who = "";

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function build(){
  deck = QUESTIONS.map(item => {
    if(!SHUFFLE) return {...item, opts:item.options, ans:item.answer};
    const pairs = item.options.map((text,i)=>({text, ok:i===item.answer}));
    const mixed = shuffle(pairs);
    return {...item, opts:mixed.map(p=>p.text), ans:mixed.findIndex(p=>p.ok)};
  });
}

function show(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(name).classList.add("on");
  window.scrollTo(0,0);
}

function drawRail(){
  $("rail").innerHTML =
    deck.map((_,i)=>{
      let cls = "";
      if(i < idx) cls = log[i].ok ? "done" : "miss";
      else if(i === idx) cls = "now";
      return `<i class="${cls}"></i>`;
    }).join("") + `<em>${idx+1} / ${deck.length}</em>`;
}

function render(){
  const item = deck[idx];
  picked = null; locked = false;

  drawRail();
  $("prompt").textContent = item.q;
  $("opts").className = "opts";
  $("opts").innerHTML = item.opts
    .map((text,i)=>`<button class="opt" data-i="${i}">${text}</button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>choose(Number(btn.dataset.i)));
  });

  $("hint").hidden = true;
  $("hint").textContent = item.hint || "";
  $("hintBtn").hidden = !item.hint;
  $("hintBtn").textContent = "힌트 보기";
  $("verdict").hidden = true;
  $("next").disabled = true;
  $("next").textContent = "답 확인";
}

function choose(i){
  if(locked) return;
  picked = i;
  $("opts").querySelectorAll(".opt").forEach((b,j)=>{
    b.classList.toggle("pick", j===i);
  });
  $("next").disabled = false;
}

function reveal(){
  const item = deck[idx];
  locked = true;
  const ok = picked === item.ans;
  log[idx] = {ok, picked, tag:item.tag};

  $("opts").classList.add("locked");
  $("opts").querySelectorAll(".opt").forEach((b,j)=>{
    b.classList.remove("pick");
    if(j === item.ans) b.classList.add("right");
    else if(j === picked) b.classList.add("wrong");
  });

  $("verdict").className = "verdict " + (ok ? "o" : "x");
  $("verdictTitle").textContent = ok ? "정답입니다" : "틀렸습니다";
  $("verdictText").textContent = item.why;
  $("verdict").hidden = false;
  $("hintBtn").hidden = true;
  $("hint").hidden = true;

  $("next").textContent = idx === deck.length-1 ? "결과 보기" : "다음 문항";
  $("verdict").scrollIntoView({behavior:"smooth", block:"nearest"});
}

function finish(){
  const right = log.filter(r=>r.ok).length;
  const sec = Math.round((Date.now()-t0)/1000);
  const mm = Math.floor(sec/60), ss = String(sec%60).padStart(2,"0");
  const wrong = log.map((r,i)=>r.ok?null:i+1).filter(v=>v!==null);

  $("who").textContent = who ? who + " 학생" : "이름을 적지 않았습니다";
  $("scoreNum").textContent = right*10;
  $("summary").textContent =
    `${deck.length}문항 중 ${right}문항 정답 · ${mm}분 ${ss}초 소요` +
    (wrong.length ? ` · 오답 ${wrong.join(", ")}번` : " · 전 문항 정답");

  $("review").innerHTML = deck.map((item,i)=>{
    const r = log[i];
    return `<details class="${r.ok?"o":"x"}">
      <summary>${i+1}. ${item.tag}${r.ok?"":" — 다시 확인"}</summary>
      <div class="body"><b>${item.opts[item.ans]}</b><br>${item.why}</div>
    </details>`;
  }).join("");

  $("copy").dataset.text =
    `[국어의 어제와 오늘 복습 퀴즈] ${who||"이름없음"} / ${right*10}점 (${right}/${deck.length}) / ` +
    (wrong.length ? `오답 ${wrong.join(",")}번` : "만점") + ` / ${mm}분${ss}초`;

  show("result");
}

$("start").addEventListener("click", ()=>{
  who = $("name").value.trim();
  build(); idx = 0; log = []; t0 = Date.now();
  show("quiz"); render();
});

$("next").addEventListener("click", ()=>{
  if(!locked){ reveal(); return; }
  if(idx === deck.length-1){ finish(); return; }
  idx++; render();
});

$("hintBtn").addEventListener("click", ()=>{
  const h = $("hint");
  h.hidden = !h.hidden;
  $("hintBtn").textContent = h.hidden ? "힌트 보기" : "힌트 접기";
});

$("copy").addEventListener("click", async ()=>{
  const text = $("copy").dataset.text || "";
  try{
    await navigator.clipboard.writeText(text);
    $("copyNote").textContent = "복사했습니다. 수업 단톡방에 붙여넣어 제출하세요.";
  }catch(e){
    $("copyNote").textContent = "복사가 막혀 있습니다. 아래 내용을 직접 옮겨 적으세요 — " + text;
  }
});

$("again").addEventListener("click", ()=>{
  build(); idx = 0; log = []; t0 = Date.now();
  show("quiz"); render();
});
</script>
</body>
</html>
