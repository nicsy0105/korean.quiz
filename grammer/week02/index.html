<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한글 맞춤법 연습</title>
<meta name="theme-color" content="#F4F5F9">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#F4F5F9;--card:#FFFFFF;--ink:#24262F;--sub:#6E7385;--line:#E3E6EF;
  --main:#4B57D1;--mainSoft:#ECEEFC;--ok:#1E9E6A;--okSoft:#E3F5EC;--no:#D9534F;--noSoft:#FCEBEA;--warm:#C7841A;
  --old:'OldK','Noto Serif CJK KR','Noto Serif KR','AppleMyungjo','Batang',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--z,1))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}
.y{font-family:var(--old);word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 48px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:36px}
.bar h1{flex:1;font-size:1.05rem;margin:0;font-weight:700;line-height:1.3}
.back{border:0;background:var(--card);border-radius:10px;padding:6px 12px;font-size:.9rem;box-shadow:0 1px 2px rgba(30,40,80,.08)}
.zoom{display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 8px;font-size:.8rem;color:var(--sub)}
.zoom button.on{border-color:var(--main);color:var(--main);background:var(--mainSoft)}
.hero{padding:6px 2px 14px}
.hero .sch{font-size:.85rem;color:var(--main);font-weight:700}
.hero h2{margin:2px 0 4px;font-size:1.4rem;line-height:1.3}
.hero p{margin:0;font-size:.88rem;color:var(--sub)}
.lnk{border:0;background:none;padding:0;font-size:.85rem;color:var(--main);text-decoration:underline}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,40,80,.05)}
.pick{display:grid;gap:10px;margin-bottom:12px}
.pick>button{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(30,40,80,.06)}
.pick>button:active{border-color:var(--main)}
.nm{font-size:1.08rem;font-weight:700}
.ds{font-size:.88rem;color:var(--sub);margin-top:2px}
.pbar{height:6px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.pnum{font-size:.8rem;color:var(--sub);margin-top:5px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:var(--card);border-radius:11px;padding:10px 0;font-size:.95rem;color:var(--sub)}
.tabs button.on{background:var(--main);color:#fff;font-weight:700}
.orig{font-size:1.3rem;line-height:2.2;word-break:keep-all}
.orig .w{border-radius:5px;padding:0 2px;cursor:pointer;border-bottom:1px dashed #B9C0E4}
.orig .w.off{border-bottom-color:transparent;color:#4a4d5a}
.orig .w.sel{background:var(--mainSoft);color:var(--main);border-bottom-color:transparent}
.trans{font-size:.93rem;line-height:1.75;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.peek{margin-top:12px;background:var(--mainSoft);border-radius:12px;padding:14px;font-size:.95rem}
.peek .hw{font-size:1.5rem}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;margin:8px 0;font-size:.93rem}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.tg{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tg span{background:#fff;color:var(--main);border-radius:99px;padding:3px 10px;font-size:.8rem}
.tip{font-size:.84rem;color:var(--sub);text-align:center;margin:10px 0}
.qtop{display:flex;justify-content:space-between;font-size:.82rem;color:var(--sub);margin-bottom:6px}
.word{text-align:center;padding:12px 4px 4px}
.word .f{font-size:2.6rem;line-height:1.5}
.word .ctx{font-size:.88rem;color:var(--sub);margin-top:2px}
.word .g{font-size:.9rem;color:var(--main);margin-top:6px;visibility:hidden}
.word .g.on{visibility:visible}
.ask{font-size:.9rem;color:var(--sub);margin:6px 0 10px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}
.done .chip,.done .opt{pointer-events:none}
.chip.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.miss{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--noSoft);border-color:var(--no);color:var(--no);text-decoration:line-through}
.qbox{font-size:1.08rem;line-height:1.7;margin:4px 0 12px;word-break:keep-all}
.opts{display:grid;gap:8px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;line-height:1.55}
.opts.ox .opt{text-align:center;font-size:1.6rem;font-weight:700;padding:14px}
.opt.hit{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--noSoft);border-color:var(--no);color:var(--no)}
.res{margin-top:14px;border-radius:12px;padding:14px;font-size:.95rem;line-height:1.7}
.res.good{background:var(--okSoft)}
.res.poor{background:var(--noSoft)}
.res .hd{font-weight:700;margin-bottom:4px}
.res .p{margin-top:6px;font-size:1.05rem}
.go{width:100%;border:0;border-radius:13px;padding:14px;background:var(--ink);color:#fff;font-size:1rem;font-weight:700;margin-top:12px}
.go[disabled]{background:var(--line);color:#A9AEBF}
.go.sub{background:var(--card);color:var(--main);border:1.5px solid var(--mainSoft)}
.chip:focus-visible,.go:focus-visible,.opt:focus-visible,.pick>button:focus-visible{outline:2px solid var(--main);outline-offset:2px}
h3{font-size:.92rem;color:var(--sub);font-weight:500;margin:0 0 10px}
.lap{background:var(--mainSoft);color:var(--main);border-radius:12px;padding:10px 12px;font-size:.9rem;text-align:center;margin-bottom:12px}
.fin{text-align:center}
.fin .big{font-size:2.6rem;font-weight:700;margin:4px 0}
.fin .say{font-size:1rem;color:var(--main);font-weight:700}
.misslist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 2px}
.misslist span{background:var(--noSoft);color:var(--no);border-radius:9px;padding:3px 10px;font-size:1.05rem}
.sent{font-size:.82rem;color:var(--sub);margin-top:10px}
.row{padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .w{font-size:1.25rem}
.row .m{font-size:.85rem;color:var(--sub);margin-left:6px}
.row .why{font-size:.85rem;margin-top:2px}
.row .why b{font-weight:500}
.miss-t{color:var(--ok)}
.bad-t{color:var(--no)}
.note h4{margin:0 0 8px;font-size:.98rem;color:var(--main)}
.note .r{display:grid;grid-template-columns:7.2em 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem;line-height:1.6}
.note .r:first-of-type{border-top:0}
.note .k{color:var(--sub);word-break:keep-all}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.stat:first-of-type{border-top:0}
.mini{height:5px;background:var(--line);border-radius:99px;overflow:hidden;width:70px;flex:none}
.mini i{display:block;height:100%;border-radius:99px}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--main)}
.err{color:var(--no);font-size:.85rem;margin-top:6px;min-height:1.2em}
.schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:8px}
.sc{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-size:1rem}
.sc[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
.sc:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.rules .opt{font-size:.9rem;line-height:1.6;padding:11px 13px}
.bogi{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px 12px;margin:0 0 12px;font-size:.95rem;line-height:1.75;background:#FBFBFE}
.bogi .bl{font-size:.8rem;color:var(--sub);text-align:center;margin-bottom:4px}
.opts.two .opt{text-align:center;font-size:1.15rem;padding:14px 8px}
.blank{color:var(--main);font-weight:700;white-space:nowrap}
.filled{color:var(--ok);font-weight:700;border-bottom:2px solid var(--ok)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar">
    <button class="back hide" id="back" type="button">← 처음</button>
    <h1 id="ttl"></h1>
    <div class="zoom" id="zoom"></div>
  </div>
  <main id="view"></main>
</div>
<script>

var CONFIG = {
  schools: ['마포고', '명덕여고', '등촌고', '화곡고'],   // 학생이 고를 학교 목록 (하나만 두면 고르는 단계 없이 그 학교로 정해짐)
  week: '주차',       // 예: '2주차' — 시트 탭 이름(학교_주차)에 쓰입니다

  perRound: 5,        // 한 판에 푸는 문항 수
  mixWrong: false     // true로 바꾸면 틀린 문항을 다음 판에 다시 섞어 냅니다 (기본: 한 회차 안에서 같은 문항이 다시 나오지 않음)
};

형태주의","음절주의"],"a":0,"n":"‘소리대로 적는다’는 발음에 따라 적는다는 뜻으로 표음주의, ‘어법에 맞도록 한다’는 형태소의 본 모양을 밝혀 적는다는 뜻으로 표의주의의 특성을 지닌다.","box":null,"id":"k6"},{"topic":"총칙 제1항","type":"mc","q":"‘어법에 맞도록 한다’의 뜻으로 알맞은 것은?","opts":["각 형태소의 본 모양을 밝혀 적는다.","들리는 발음대로만 적는다.","단어마다 띄어 쓴다.","외래어는 원어대로 적는다."],"a":0,"n":"‘어법에 맞도록 한다’는 각 형태소의 본 모양을 밝혀 적는다는 뜻이다.","box":null,"id":"k7"},{"topic":"총칙 제1항","type":"mc","q":"표음주의와 표의주의에 대한 설명으로 알맞지 않은 것은?","opts":["표음주의는 단어를 소리 나는 대로 적는 방법이다.","표음주의는 쓰기에는 편하지만 뜻을 파악하기 어려울 수 있다.","표의주의는 형태소의 본 모양을 밝혀 적어 뜻을 파악하기 쉽다.","표의주의를 따르면 표기와 발음이 언제나 똑같아진다."],"a":3,"n":"표의주의는 뜻을 파악하기 쉽지만, 표기가 발음과 달라지는 경우가 많다.","box":null,"id":"k8"},{"topic":"총칙 제1항","type":"mc","q":"‘나무가 쌓여 있다.’에서 ‘쌓여’를 [싸여]라는 소리대로 적지 않는 까닭은?","opts":["‘싸여’로 적으면 천 같은 것에 싸여 있다는 뜻으로 오해할 수 있어서","‘싸여’가 더 쓰기 어려워서","‘쌓여’가 소리 나는 대로 적은 것이어서","‘쌓여’가 표준어가 아니어서"],"a":0,"n":"소리대로만 적으면 원래의 의미를 정확하게 전달하기 어렵다. 그래서 어법에 맞도록 형태를 밝혀 ‘쌓여’로 적는다.","box":null,"id":"k9"},{"topic":"총칙 제1항","type":"mc","q":"다음 중 소리 나는 대로 적은 것이 아니라, 형태소의 본 모양을 밝혀 적은 예는?","opts":["나무가[나무가]","꽃이[꼬치]","바다[바다]","하늘[하늘]"],"a":1,"n":"‘꽃이’는 [꼬치]로 소리 나지만 체언 ‘꽃’과 조사 ‘이’의 본 모양을 밝혀 적었다(어법에 맞도록).","box":null,"id":"k10"},{"topic":"총칙 제1항","type":"mc","q":"다음 중 소리와 표기가 달라, 어법에 맞도록 형태를 밝혀 적은 말은?","opts":["날씨가","같이","노래를","기차가"],"a":1,"n":"‘같이’는 [가치]로 소리 나지만 어간 ‘같-’의 원형을 밝혀 적었다. 나머지는 소리와 표기가 같다.","box":null,"id":"k11"},{"topic":"총칙 제2항과 띄어쓰기","type":"ox","q":"한글 맞춤법 제2항에 따르면 문장의 각 단어는 띄어 씀을 원칙으로 한다.","opts":["O","X"],"a":0,"n":"제2항: 문장의 각 단어는 띄어 씀을 원칙으로 한다. 단어는 분리하여 독립적으로 쓸 수 있는 말이다.","id":"k12"},{"topic":"총칙 제2항과 띄어쓰기","type":"ox","q":"조사는 하나의 단어이므로 앞말과 띄어 쓴다.","opts":["O","X"],"a":1,"n":"조사는 단어이지만 혼자 쓰일 수 없으므로 앞말에 붙여 쓴다.","id":"k13"},{"topic":"총칙 제2항과 띄어쓰기","type":"mc","q":"‘흰색연필도사다줘.’처럼 띄어쓰기를 하지 않으면 생기는 문제는?","opts":["‘흰 색연필’인지 ‘흰색 연필’인지 뜻이 분명하지 않다.","글자 수가 늘어난다.","맞춤법 검사기가 작동하지 않는다.","발음이 바뀐다."],"a":0,"n":"띄어쓰기를 하지 않으면 의미를 정확하게 전달하기 어려워 의사소통에 문제가 생길 수 있다.","box":null,"id":"k14"},{"topic":"총칙 제2항과 띄어쓰기","type":"mc","q":"‘만’이 의존 명사로 쓰인 문장은?","opts":["하나만 먹어라.","이것은 그것만 못하다.","세 번 만에 시험에 합격했다.","너만 믿는다."],"a":2,"n":"시간의 경과나 횟수를 나타내는 ‘만’은 의존 명사이므로 띄어 쓴다. 체언에 붙어 한정이나 비교의 뜻을 나타내는 ‘만’은 조사이다.","box":null,"id":"k15"},{"topic":"총칙 제2항과 띄어쓰기","type":"mc","q":"〈보기〉의 (가), (나)에 쓰인 ‘만큼’을 바르게 분석한 것은?","opts":["(가)는 의존 명사, (나)는 조사이다.","(가)와 (나) 모두 조사이다.","(가)와 (나) 모두 의존 명사이다.","(가)는 조사, (나)는 의존 명사이다."],"a":0,"n":"(가)는 ‘건네주는’의 꾸밈을 받는 의존 명사라서 띄어 쓰고, (나)는 체언 ‘그녀’ 뒤에 붙은 조사라서 붙여 쓴다.","box":"(가) 현수는 연주가 건네주는 만큼 받아 왔다.\n(나) 열심히 노력하면 너도 그녀만큼 해낼 수 있어.","id":"k16"},{"topic":"총칙 제2항과 띄어쓰기","type":"mc","q":"〈보기〉에서 띄어 써야 할 곳을 모두 바르게 고친 것은?","opts":["이곳에서 지낸 지 벌써 일 년이 지났다. 의지할 존재는 강아지뿐이지만, 혼자인 대로 잘 지낸다.","이곳에서 지낸지 벌써 일 년이 지났다. 의지할 존재는 강아지 뿐이지만, 혼자인 대로 잘 지낸다.","이곳에서 지낸 지 벌써 일년이 지났다. 의지할 존재는 강아지뿐이지만, 혼자인대로 잘 지낸다.","이곳에서 지낸 지 벌써 일 년이 지났다. 의지할 존재는 강아지 뿐이지만, 혼자인 대로 잘 지낸다."],"a":0,"n":"시간 경과의 ‘지’는 의존 명사, ‘년’은 단위 명사라 띄어 쓴다. 체언 뒤의 ‘뿐’은 조사라 붙여 쓰고, 관형어 뒤의 ‘대로’는 의존 명사라 띄어 쓴다.","box":"이곳에서지낸지벌써일년이지났다. 의지할존재는강아지뿐이지만, 혼자인대로잘지낸다.","id":"k17"},{"topic":"총칙 제2항과 띄어쓰기","type":"mc","q":"‘대로’의 쓰임이 나머지와 다른 하나는?","opts":["약속한 대로 행동했다.","들은 대로 말해 봐.","법대로 처리하자.","아는 대로 적어라."],"a":2,"n":"‘법대로’의 ‘대로’는 체언 뒤에 붙은 조사이다. 나머지는 관형어 뒤의 의존 명사라서 띄어 쓴다.","box":null,"id":"k18"},{"topic":"총칙 제2항과 띄어쓰기","type":"mc","q":"‘밖에’의 띄어쓰기가 바른 것은?","opts":["나에게는 너 밖에 없다.","창문밖에 비가 내린다.","우리 반에는 두 명밖에 오지 않았다.","가진 것이 이것 밖에 없다."],"a":2,"n":"‘그것 말고는’의 뜻으로 부정어와 함께 쓰이는 ‘밖에’는 조사라서 붙여 쓴다(너밖에, 두 명밖에, 이것밖에). ‘창문 밖에’의 ‘밖’은 명사라서 띄어 쓴다.","box":null,"id":"k19"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정이 적용된 예로 알맞은 것은?","opts":["굳이","얼음","무늬","깍두기"],"a":0,"n":"‘굳이’는 [구지]로 소리 나지만 ‘ㄷ’ 받침을 밝혀 적는다.","box":"‘ㄷ, ㅌ’ 받침 뒤에 종속적 관계를 가진 ‘-이(-)’나 ‘-히-’가 올 적에는, 그 ‘ㄷ, ㅌ’이 ‘ㅈ, ㅊ’으로 소리 나더라도 ‘ㄷ, ㅌ’으로 적는다.","id":"k20"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정에 따라 바르게 적은 것은?","opts":["내일 또 봬요.","내일 또 뵈요.","그러면 안 되요.","의사가 됬다."],"a":0,"n":"‘뵈어요’가 줄어 ‘봬요’가 된다. ‘안 돼요’, ‘됐다’로 적어야 한다.","box":"‘ㅚ’ 뒤에 ‘-어, -었-’이 어울려 ‘ㅙ, ㅙㅆ’으로 될 적에도 준 대로 적는다.","id":"k21"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정에 맞게 적은 것은?","opts":["내일 꼭 갈께.","그럴 줄 알았을껄.","공부는 할수록 재미있다.","다 끝낼께요."],"a":2,"n":"‘-(으)ㄹ수록’은 예사소리로 적는다. ‘갈게, 알았을걸, 끝낼게요’로 적어야 한다.","box":"‘-(으)ㄹ걸, -(으)ㄹ게, -(으)ㄹ수록’ 등의 어미는 예사소리로 적는다.","id":"k22"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 ‘다만’ 규정이 적용된 예로 알맞은 것은?","opts":["내일 같이 갈까?","곧 연락할게.","먹을수록 배가 고프다.","그럴 줄 알았을걸."],"a":0,"n":"의문을 나타내는 ‘-(으)ㄹ까?’는 된소리로 적는다. 나머지는 예사소리로 적는 어미이다.","box":"‘-(으)ㄹ걸, -(으)ㄹ게’ 등의 어미는 예사소리로 적는다.\n다만, 의문을 나타내는 ‘-(으)ㄹ까?, -(스)ㅂ니까?’ 등은 된소리로 적는다.","id":"k23"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정에 따라 바르게 적은 문장은?","opts":["얼마나 춥든지 손이 얼었어.","어제 발표 잘하든데?","가든지 오든지 마음대로 해라.","그러던지 말던지 상관없어."],"a":2,"n":"선택의 뜻은 ‘-든지’, 지난 일은 ‘-던’으로 적는다. ‘춥던지, 잘하던데, 그러든지 말든지’가 맞다.","box":"1. 지난 일을 나타내는 어미는 ‘-더라, -던’으로 적는다.\n2. 물건이나 일의 내용을 가리지 아니하는 뜻을 나타내는 조사와 어미는 ‘(-)든지’로 적는다.","id":"k24"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 ‘다만’ 규정이 적용된 예는?","opts":["얼음","웃음","노름","귀걸이"],"a":2,"n":"‘노름’은 ‘놀다’에서 왔지만 본뜻에서 멀어져 원형을 밝히지 않는다. 나머지는 원형을 밝혀 적은 예이다.","box":"어간에 ‘-이’나 ‘-음/-ㅁ’이 붙어서 명사로 된 것은 그 어간의 원형을 밝히어 적는다.\n다만, 어간의 본뜻에서 멀어진 것은 원형을 밝히어 적지 아니한다.","id":"k25"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정이 적용된 예로 알맞은 것은?","opts":["너머","높이","믿음","얼음"],"a":0,"n":"‘너머’는 ‘넘-’에 ‘-어’가 붙어 명사가 된 말이라 원형을 밝히지 않는다. 나머지는 ‘-이, -음’이 붙어 원형을 밝힌 예이다.","box":"어간에 ‘-이’나 ‘-음’ 이외의 모음으로 시작된 접미사가 붙어서 다른 품사로 바뀐 것은 그 어간의 원형을 밝히어 적지 아니한다.","id":"k26"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정에 따라 ‘률/율’을 바르게 적은 것끼리 묶은 것은?","opts":["합격률, 비율, 선율","합격율, 비율, 선률","합격률, 비률, 선율","합격율, 비률, 선률"],"a":0,"n":"‘합격률’은 ‘ㄱ’ 받침 뒤라 본음대로 ‘률’, ‘비율’은 모음 뒤, ‘선율’은 ‘ㄴ’ 받침 뒤라 ‘율’로 적는다.","box":"한자음 ‘률’이 단어의 첫머리 이외의 자리에 올 때에는 본음대로 적는다.\n다만, 모음이나 ‘ㄴ’ 받침 뒤에 이어지는 ‘렬, 률’은 ‘열, 율’로 적는다.","id":"k27"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정이 적용된 예로 알맞은 것은?","opts":["깍두기","잔뜩","국수","몹시"],"a":1,"n":"‘잔뜩’은 ‘ㄴ’ 받침 뒤에서 나는 된소리라 된소리로 적는다. ‘깍두기, 국수, 몹시’는 ‘ㄱ, ㅂ’ 받침 뒤라 예사소리로 적는다.","box":"한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다. (두 모음 사이, ‘ㄴ, ㄹ, ㅁ, ㅇ’ 받침 뒤)","id":"k28"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉의 규정이 적용된 예로 알맞지 않은 것은?","opts":["무늬","희망","띄어쓰기","의자"],"a":3,"n":"‘의자’는 [의자]로 소리 나는 대로 적은 것이라 이 규정의 예로 보기 어렵다. ‘무늬, 희망, 띄어쓰기’는 [ㅣ]로 소리 나도 ‘ㅢ’로 적은 예이다.","box":"자음을 첫소리로 가지고 있는 음절의 ‘ㅢ’는 ‘ㅣ’로 소리 나는 경우가 있더라도 ‘ㅢ’로 적는다.","id":"k29"},{"topic":"규정 적용 예문 분석","type":"mc","q":"〈보기〉에서 맞춤법에 어긋난 것은?","opts":["민망한 일","어이없다는 듯","멋적어서","새빨개지고"],"a":2,"n":"‘멋쩍어서’로 적어야 한다. 교과서의 맞춤법 검사기 예시에서 고친 표기이다.","box":"오늘 민망한 일이 있었다. 그 친구가 어이없다는 듯 쳐다보아서 순간 멋적어서 얼굴이 새빨개지고 말았다.","id":"k30"},{"topic":"규정 적용 예문 분석","type":"mc","q":"다음 대화에서 맞춤법에 맞게 쓴 것은?","opts":["가도 되?","안 되.","강아지에요!","고마워."],"a":3,"n":"‘가도 돼?’, ‘안 돼.’, ‘강아지예요!’로 고쳐야 한다.","box":"A: 오늘 강아지 보러 너희 집 가도 되?\nB: 안 되. 대신 사진 보내 줄게. 짱 귀여운 강아지에요!\nA: 고마워.","id":"k31"},{"topic":"규정 적용 예문 분석","type":"mc","q":"‘되’와 ‘돼’를 구별하는 방법으로 알맞은 것은?","opts":["그 자리에 ‘되어’를 넣어 자연스러우면 ‘돼’로 적는다.","문장 끝이면 항상 ‘되’로 적는다.","소리가 [돼]로 나면 ‘되’로 적는다.","높임말 앞에서는 ‘돼’로 적는다."],"a":0,"n":"‘돼’는 ‘되어’의 준말이다. ‘되어’를 넣어 자연스러우면 ‘돼’, ‘되’만 써서 뒤에 다른 어미가 바로 붙으면(되고, 되니) ‘되’로 적는다.","box":null,"id":"k32"},{"topic":"국어 생활 성찰","type":"mc","q":"‘국어 생활을 성찰한다’의 뜻으로 알맞은 것은?","opts":["일상생활에서 규범에 맞게 국어를 사용하고 있는지 되돌아보는 것","다른 나라 말을 배우는 것","새로운 말을 만들어 퍼뜨리는 것","다른 사람의 말실수를 지적하는 것"],"a":0,"n":"국어 생활을 성찰한다는 것은 일상생활에서 규범에 맞게 국어를 사용하고 있는지 되돌아보는 것이다.","box":null,"id":"k33"},{"topic":"국어 생활 성찰","type":"mc","q":"자신의 국어 표기를 점검하고 성찰하는 방법으로 알맞지 않은 것은?","opts":["맞춤법 검사기로 자신이 쓴 글을 점검한다.","성찰 일지나 점검표를 작성한다.","국어사전과 한글 맞춤법 규정을 찾아본다.","친구들이 많이 쓰는 표기라면 그대로 따른다."],"a":3,"n":"많이 쓰는 표기라도 맞춤법에 어긋날 수 있다. 구조화된 점검표, 관찰 기록표, 성찰 일지, 자기 보고서, 맞춤법 검사기 등으로 점검할 수 있다.","box":null,"id":"k34"},{"topic":"국어 생활 성찰","type":"mc","q":"간판이나 자막 속 잘못된 표기를 바르게 고친 것이 아닌 것은?","opts":["된장찌게 → 된장찌개","순대국 → 순댓국","왠일이니 → 웬일이니","어떡해 → 어떻해"],"a":3,"n":"‘어떻게 해’가 줄어든 말은 ‘어떡해’가 바른 표기이다.","box":null,"id":"k35"}],"notes":[{"title":"한글 맞춤법","rows":[["개념","한글로 우리말을 적을 때 지켜야 할 기준을 정해 놓은 규범"],["의의","의미를 정확하게 전달하여 원활하게 의사소통할 수 있음 · 교양 있는 표기 생활을 할 수 있음"],["구성","제1장 총칙 · 제2장 자모 · 제3장 소리에 관한 것 · 제4장 형태에 관한 것 · 제5장 띄어쓰기 · 제6장 그 밖의 것"],["역사","1933년 ‘한글 맞춤법 통일안’ 바탕, 1988년 문교부 확정·고시"]]},{"title":"총칙 제1항","rows":[["규정","한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다."],["소리대로","발음에 따라 적음 → 표음주의 (쓰기 편하지만 뜻 파악이 어려움)"],["어법에 맞도록","각 형태소의 본 모양을 밝혀 적음 → 표의주의 (뜻 파악이 쉽지만 발음과 달라지기도 함)"],["예문 분석","나무가 쌓여 있다 — ‘나무가’는 소리대로, ‘쌓여’는 어법에 맞도록 ([싸여]로 적으면 뜻이 달라짐) / 꽃이[꼬치], 같이[가치]도 형태를 밝혀 적은 예"]]},{"title":"총칙 제2항과 띄어쓰기","rows":[["규정","문장의 각 단어는 띄어 씀을 원칙으로 한다."],["까닭","띄어 쓰지 않으면 의미를 정확하게 전달하기 어려움 (흰색연필 → 흰 색연필? 흰색 연필?)"],["조사","조사는 단어이지만 앞말에 붙여 씀 — 꽃처럼, 너마저, 처음부터, 두 명밖에"],["헷갈리는 말","‘만큼, 대로, 뿐’ — 체언 뒤면 조사(붙여 씀), 관형어 뒤면 의존 명사(띄어 씀) / ‘만’ — 한정·비교면 조사, 시간의 경과·횟수면 의존 명사"]]},{"title":"국어 생활 성찰","rows":[["뜻","일상생활에서 규범에 맞게 국어를 사용하고 있는지 되돌아보는 것"],["방법","점검표, 관찰 기록표, 성찰 일지, 자기 보고서, 맞춤법 검사기, 국어사전 찾아보기"]]}]};

/* ---------- 기록 (학생 기기에 저장) ---------- */
// 한 기기를 여러 학생이 써도 섞이지 않게 '학교|이름'마다 따로 저장한다
var KEY = 'kq2:' + location.pathname;
var G = {zoom: 1, me: null, users: {}, outbox: []};
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) G[k] = o[k]; } } catch (e) {}
var S = null;   // 지금 학생의 기록
function blank() { return {cards: {}, tags: {}, topics: {}, recent: {}, laps: {}}; }
function login(school, name) {
  G.me = {school: school, name: name};
  var k = school + '|' + name;
  S = G.users[k] || (G.users[k] = blank());
  save();
  try { localStorage.setItem('kq-me', JSON.stringify(G.me)); } catch (e) {}   // 다른 주차 퀴즈에서 미리 채워 주기용
}
function loggedIn() { return !!(G.me && S && CONFIG.schools.indexOf(G.me.school) >= 0); }
if (G.me && CONFIG.schools.indexOf(G.me.school) >= 0) login(G.me.school, G.me.name);
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }

var M = DATA.meta, KIND = M.main.kind === 'spell' ? 'spell' : 'card', RULES = DATA.rules || {};
var CARDS = DATA.cards, QCARDS = CARDS.filter(function (c) { return c.q !== false; }), KQ = DATA.concepts;
var CAT = {}; Object.keys(DATA.tags).forEach(function (k) { DATA.tags[k].forEach(function (t) { CAT[t] = k; }); });

/* ---------- 도우미 ---------- */
function $(id) { return document.getElementById(id); }
function V() { return $('view'); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (m) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]; }); }
var JAMO = /[\u1100-\u11FF\uA960-\uA97F\uD7B0-\uD7FF]/;
// 옛한글이 섞인 낱말만 풀어 쓴 자모(NFD)로 바꿔 옛한글 글꼴로 보여 준다
function oh(s) {
  return String(s).split(/(\s+)/).map(function (tok) {
    return JAMO.test(tok) ? '<span class="y">' + esc(tok.normalize('NFD')) + '</span>' : esc(tok);
  }).join('');
}
function yy(s) { return '<span class="y">' + esc(String(s).normalize('NFD')) + '</span>'; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function st(id) { return S.cards[id] || (S.cards[id] = {seen: 0, wrong: 0}); }
// 회차: 모든 문항을 한 번씩 풀면 한 회차가 끝난다. 한 회차 안에서는 같은 문항이 다시 나오지 않는다.
function homeArea(x) { return KQ.indexOf(x) >= 0 ? 'concept' : 'card'; }
function curLap(area) { return S.laps[area] || 1; }
function seenNow(x) { var s = S.cards[x.id]; return !!s && s.lap === curLap(homeArea(x)); }
function isWrong(x) { var s = S.cards[x.id]; return !!s && s.ok === false; }
function tally(list) { var a = 0, r = 0; list.forEach(function (x) { if (seenNow(x)) { a++; if (S.cards[x.id].ok) r++; } }); return [a, r]; }
function record(x, ok, last) {
  var s = st(x.id); s.seen++; s.ok = ok; s.lap = curLap(homeArea(x));
  if (!ok) { s.wrong++; s.last = last; }
  save();
}
function each(sel, fn) { Array.prototype.forEach.call(V().querySelectorAll(sel), fn); }

/* ---------- 머리 ---------- */
var ZOOMS = [['작게', 0.9], ['보통', 1], ['크게', 1.15]];
function drawZoom() {
  document.documentElement.style.setProperty('--z', G.zoom || 1);
  $('zoom').innerHTML = ZOOMS.map(function (z, i) {
    return '<button type="button" data-z="' + i + '"' + ((G.zoom || 1) === z[1] ? ' class="on"' : '') + '>' + z[0] + '</button>';
  }).join('');
  Array.prototype.forEach.call($('zoom').children, function (b) {
    b.onclick = function () { G.zoom = ZOOMS[+b.getAttribute('data-z')][1]; save(); drawZoom(); };
  });
}
function setTop(title, showBack) {
  $('ttl').textContent = title || '';
  $('back').className = showBack ? 'back' : 'back hide';
  $('back').onclick = home;
  window.scrollTo(0, 0);
}

/* ---------- 시작 화면: 학교 선택 + 이름 ---------- */
function signIn() {
  setTop('', false);
  var one = CONFIG.schools.length === 1;
  var prev = G.me;
  if (!prev) { try { prev = JSON.parse(localStorage.getItem('kq-me')); } catch (e) {} }
  var cur = one ? CONFIG.schools[0] : (prev && CONFIG.schools.indexOf(prev.school) >= 0 ? prev.school : '');
  var h = '<div class="hero"><div class="sch">' + esc(CONFIG.week) + '</div>'
    + '<h2>' + esc(M.title) + '</h2><p>' + (CONFIG.sheetUrl ? '풀이 결과가 선생님께 전달됩니다. 학교와 이름을 정확히 입력하세요.' : '학교와 이름을 입력하세요.') + '</p></div>';
  if (!one) {
    h += '<div class="box"><h3>학교</h3><div class="schools" id="schs">'
      + CONFIG.schools.map(function (x) { return '<button type="button" class="sc" aria-pressed="' + (x === cur) + '" data-s="' + esc(x) + '">' + esc(x) + '</button>'; }).join('')
      + '</div><div class="err" id="scerr"></div></div>';
  }
  h += '<div class="box"><h3>이름</h3><input type="text" id="nm" maxlength="20" placeholder="예: 홍길동" value="' + esc(prev ? prev.name : '') + '" autocomplete="off">'
    + '<div class="err" id="nmerr"></div></div>'
    + '<button type="button" class="go" id="nmgo">시작하기</button>';
  V().innerHTML = h;
  if (!one) Array.prototype.forEach.call($('schs').children, function (b) {
    b.onclick = function () {
      cur = b.getAttribute('data-s');
      Array.prototype.forEach.call($('schs').children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      $('scerr').textContent = '';
    };
  });
  var inp = $('nm');
  inp.oninput = function () { $('nmerr').textContent = ''; };
  inp.onkeydown = function (e) { if (e.key === 'Enter') $('nmgo').click(); };
  $('nmgo').onclick = function () {
    var v = inp.value.replace(/\s+/g, ' ').trim(), bad = false;
    if (!cur) { $('scerr').textContent = '학교를 고르세요.'; bad = true; }
    if (!v) { $('nmerr').textContent = '이름을 입력하세요.'; if (!bad) inp.focus(); bad = true; }
    if (bad) return;
    login(cur, v); home();
  };
}

/* ---------- 처음 화면 ---------- */
function home() {
  if (!loggedIn()) return signIn();
  setTop('', false);
  var tc = tally(QCARDS), tk = tally(KQ);
  var h = '<div class="hero"><div class="sch">' + esc(G.me.school + ' · ' + CONFIG.week) + '</div>'
    + '<h2>' + esc(M.title) + '</h2>'
    + '<p>' + esc(G.me.name) + ' · <button type="button" class="lnk" id="chn">학교·이름 바꾸기</button></p></div>'
    + '<div class="pick">'
    + '<button type="button" id="gw"><div class="nm">' + esc(M.main.name) + '</div>'
    + '<div class="ds">' + oh(M.main.desc) + '</div>'
    + '<div class="pbar"><i style="width:' + Math.round(tc[0] / QCARDS.length * 100) + '%"></i></div>'
    + '<div class="pnum">' + M.main.unit + ' ' + QCARDS.length + '개 중 ' + tc[0] + '개 풀었어요 · 정답 ' + tc[1] + '개' + lapTail('card') + '</div></button>'
    + '<button type="button" id="gk"><div class="nm">' + esc(M.concept.name) + '</div>'
    + '<div class="ds">' + esc(M.concept.desc) + '</div>'
    + '<div class="pbar"><i style="width:' + Math.round(tk[0] / KQ.length * 100) + '%"></i></div>'
    + '<div class="pnum">문항 ' + KQ.length + '개 중 ' + tk[0] + '개 풀었어요 · 정답 ' + tk[1] + '개' + lapTail('concept') + '</div></button>'
    + '</div>';
  var weak = weakTags(3);
  h += '<div class="box"><h3>' + esc(M.main.weak) + '만 골라 풀기</h3>';
  h += weak.length
    ? '<div class="tip" style="text-align:left;margin:0 0 4px">' + weak.map(function (x) { return esc(x[0]) + ' ' + Math.round(x[1] * 100) + '%'; }).join(' · ') + '</div>'
      + '<div class="tip" style="text-align:left;margin:0">위 항목이 들어 있는 ' + M.main.unit + '만 뽑아 ' + CONFIG.perRound + '문항을 냅니다.</div>'
      + '<button type="button" class="go" id="mix">' + esc(M.main.weak) + ' ' + CONFIG.perRound + '문항 풀기</button>'
    : '<div class="tip" style="text-align:left;margin:0">' + esc(M.main.label) + '를 몇 판 풀면 자주 틀리는 것을 찾아 줍니다.</div>';
  h += '</div><div class="tip"><button type="button" class="lnk" id="rst">내 기록 모두 지우기</button></div>';
  V().innerHTML = h;
  $('gw').onclick = function () { work('read'); };
  $('gk').onclick = function () { concept('read'); };
  $('chn').onclick = signIn;
  if ($('mix')) $('mix').onclick = weakRound;
  $('rst').onclick = function () {
    if (confirm(G.me.name + ' 학생의 풀이 기록을 이 기기에서 지웁니다.')) {
      var b = blank(); for (var k in b) S[k] = b[k]; save(); home();
    }
  };
}
function lapTail(area) { var n = curLap(area); return n > 1 ? ' · ' + n + '회차' : ''; }
function weakTags(n) {
  return Object.keys(S.tags).map(function (t) { var s = S.tags[t]; return [t, s.hit / s.seen, s.seen]; })
    .filter(function (x) { return x[2] >= 3 && x[1] < 0.85; })
    .sort(function (a, b) { return a[1] - b[1]; }).slice(0, n);
}

/* ---------- 작품 화면 ---------- */
function tabs(list, cur, fn) {
  return '<div class="tabs">' + list.map(function (t) {
    return '<button type="button" data-t="' + t[0] + '"' + (t[0] === cur ? ' class="on"' : '') + '>' + t[1] + '</button>';
  }).join('') + '</div>';
}
function bindTabs(fn) { each('.tabs button', function (b) { b.onclick = function () { fn(b.getAttribute('data-t')); }; }); }

function work(tab) {
  setTop(M.main.name, true);
  var h = tabs([['read', M.main.read], ['quiz', '문제'], ['note', '오답노트']], tab);
  if (tab === 'read') h += KIND === 'spell' ? ruleTab() : readTab();
  if (tab === 'note') h += cardNote();
  V().innerHTML = h + (tab === 'quiz' ? '<div id="qv"></div>' : '');
  bindTabs(work);
  if (tab === 'read' && KIND === 'card') bindRead();
  if (tab === 'note') bindCardNote();
  if (tab === 'quiz') { var p = pick(QCARDS, CONFIG.perRound, 'card', true); start(KIND, p.list, M.main.label, p.lap); }
}
function readTab() {
  return '<div class="box"><div class="orig" id="orig">'
    + CARDS.map(function (c, i) { return '<span class="w y' + (c.q ? '' : ' off') + '" data-i="' + i + '">' + esc(c.f.normalize('NFD')) + '</span>'; }).join(' ')
    + '</div><div class="tip" style="text-align:right;margin:4px 0 0">— ' + esc(DATA.source) + '</div>'
    + '<div class="trans">' + esc(DATA.trans) + '</div><div id="peek"></div></div>'
    + '<div class="tip">밑줄 친 어절을 누르면 분석이 열립니다. 원문은 띄어 쓰지 않았지만 여기서는 어절마다 띄우고 방점은 생략했습니다.</div>';
}
function bindRead() {
  $('orig').onclick = function (ev) {
    var t = ev.target;
    while (t && t !== this && !(t.getAttribute && t.getAttribute('data-i') !== null)) t = t.parentNode;
    if (!t || t === this) return;
    Array.prototype.forEach.call(this.querySelectorAll('.w'), function (x) { x.classList.remove('sel'); });
    t.classList.add('sel');
    var c = CARDS[+t.getAttribute('data-i')];
    $('peek').innerHTML = '<div class="peek"><div class="hw">' + yy(c.f) + '</div>'
      + '<dl class="kv"><dt>현대어</dt><dd>' + esc(c.m) + '</dd><dt>짜임</dt><dd>' + oh(c.p) + '</dd></dl>'
      + (c.t.length ? '<div class="tg">' + c.t.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '')
      + '<div>' + oh(c.n) + '</div></div>';
  };
}
function cardNote() {
  var L = QCARDS.filter(isWrong);
  var h = '<div class="box"><h3>틀린 ' + M.main.unit + ' ' + L.length + '개</h3>';
  h += L.length ? L.map(function (c) {
    if (KIND === 'spell') return spellNoteRow(c);
    var l = (S.cards[c.id].last) || {miss: [], bad: []};
    return '<div class="row"><span class="w">' + yy(c.f) + '</span><span class="m">' + esc(c.m) + '</span>'
      + (l.miss.length ? '<div class="why"><b class="miss-t">놓친 것</b> ' + l.miss.map(esc).join(', ') + '</div>' : '')
      + (l.bad.length ? '<div class="why"><b class="bad-t">아닌 것</b> ' + l.bad.map(esc).join(', ') + '</div>' : '') + '</div>';
  }).join('') : '<div class="tip" style="text-align:left">아직 틀린 ' + M.main.unit + '이 없어요.</div>';
  h += '</div>';
  if (L.length) h += '<button type="button" class="go" id="redo" style="margin-bottom:12px">틀린 ' + M.main.unit + ' 다시 풀기</button>';
  h += tagStats();
  return h;
}
function bindCardNote() {
  if ($('redo')) $('redo').onclick = function () {
    var L = QCARDS.filter(isWrong);
    V().innerHTML = '<div id="qv"></div>';
    start(KIND, pick(L, CONFIG.perRound, 'redo', false).list, '틀린 ' + M.main.unit + ' 다시 풀기');
  };
}
function tagStats() {
  var rows = Object.keys(S.tags).map(function (t) { var s = S.tags[t]; return [t, s.hit / s.seen, s.seen]; })
    .filter(function (x) { return x[2] >= 2; }).sort(function (a, b) { return a[1] - b[1]; });
  if (!rows.length) return '';
  return '<div class="box"><h3>' + esc(M.main.stat) + '</h3>' + rows.map(function (x) {
    var p = Math.round(x[1] * 100), col = p >= 85 ? 'var(--ok)' : p >= 60 ? 'var(--warm)' : 'var(--no)';
    return '<div class="stat"><span>' + esc(x[0]) + ' <span style="color:var(--sub);font-size:.8rem">' + esc(CAT[x[0]] || '') + '</span></span>'
      + '<span style="display:flex;align-items:center;gap:8px"><span class="mini"><i style="width:' + p + '%;background:' + col + '"></i></span>'
      + '<span style="font-size:.85rem;min-width:2.6em;text-align:right">' + p + '%</span></span></div>';
  }).join('') + '</div>';
}

/* ---------- 개념 화면 ---------- */
function concept(tab) {
  setTop(M.concept.short || '기본 개념', true);
  var h = tabs([['read', '정리 노트'], ['quiz', '문제'], ['note', '오답노트']], tab);
  if (tab === 'read') h += DATA.notes.map(function (g) {
    return '<div class="box note"><h4>' + esc(g.title) + '</h4>' + g.rows.map(function (r) {
      return '<div class="r"><div class="k">' + oh(r[0]) + '</div><div>' + oh(r[1]) + '</div></div>';
    }).join('') + '</div>';
  }).join('');

    var L = KQ.filter(isWrong);

      return '<div class="row"><div style="font-size:.95rem">' + oh(k.q) + '</div>' + bogi(k)

  bindTabs(concept);
  if (tab === 'quiz') { var p = pick(KQ, CONFIG.perRound, 'concept', true); start('concept', p.list, '개념 문제', p.lap); }
  if ($('redo')) $('redo').onclick = function () {
    var L = KQ.filter(isWrong);
    V().innerHTML = '<div id="qv"></div>';
    start('concept', pick(L, CONFIG.perRound, 'credo', false).list, '틀린 개념 다시 풀기');
  };
}

/* ---------- 출제 ---------- */
// 이번 회차에 아직 안 푼 문항에서만 뽑는다. 다 풀면 다음 회차로 넘어간다.
// 틀린 문항은 오답노트의 '다시 풀기'로 따로 푼다 (CONFIG.mixWrong이 true면 판마다 섞어 냄).
function pick(pool, n, area, cycle) {
  var lap = 0, fresh = pool.filter(function (x) { return !seenNow(x); }), out = [];
  if (cycle && !fresh.length) {
    S.laps[area] = curLap(area) + 1; lap = S.laps[area];
    fresh = pool.slice();
  }
  if (CONFIG.mixWrong && cycle) {
    out = shuffle(pool.filter(function (x) { return isWrong(x) && fresh.indexOf(x) < 0; })).slice(0, Math.round(n * 0.4));
  }
  shuffle(fresh).forEach(function (x) { if (out.length < n) out.push(x); });
  if (!cycle) shuffle(pool).forEach(function (x) { if (out.length < n && out.indexOf(x) < 0) out.push(x); });
  save();
  return {list: shuffle(out), lap: lap};
}
function weakRound() {
  var w = weakTags(3).map(function (x) { return x[0]; });
  var pool = QCARDS.filter(function (c) {
    return KIND === 'spell' ? w.indexOf(tagKey(c)) >= 0 : c.t.concat(c.d).some(function (t) { return w.indexOf(t) >= 0; });
  });
  setTop(M.main.weak + ' 풀기', true);
  V().innerHTML = '<div id="qv"></div>';
  start(KIND, pick(pool, CONFIG.perRound, 'weak', false).list, M.main.weak);
}

/* ---------- 문제 풀기 ---------- */
var Q = null;
function start(kind, list, label, lap) {
  Q = {kind: kind, list: list, label: label, i: 0, right: 0, log: [], lap: lap || 0};
  ask();
}
function ask() {
  var x = Q.list[Q.i], h = '';
  if (Q.i === 0 && Q.lap) h += '<div class="lap">모든 문항을 끝냈어요! ' + Q.lap + '회차를 시작합니다.</div>';
  h += '<div class="box" id="qb"><div class="qtop"><span>' + esc(Q.label) + '</span><span>' + (Q.i + 1) + ' / ' + Q.list.length + '</span></div>';
  if (Q.kind === 'card') {
    Q.opts = shuffle(x.t.concat(x.d)); Q.picked = {};
    h += '<div class="word"><div class="f">' + yy(x.f) + '</div><div class="ctx">' + ctx(x) + '</div>'
      + '<div class="g" id="gl">' + esc(x.m) + '</div></div>'
      + '<div class="ask">이 어절에 나타난 것을 모두 고르세요</div>'
      + '<div class="chips" id="chips">' + Q.opts.map(function (t) { return '<button type="button" class="chip" data-t="' + esc(t) + '" aria-pressed="false">' + esc(t) + '</button>'; }).join('') + '</div>'
      + '<div id="res"></div><button type="button" class="go" id="go" disabled>확인</button>';
  } else if (Q.kind === 'spell') {
    Q.o = shuffle(x.o); Q.p1 = null; Q.p2 = null;
    h += '<div class="qbox" id="sent1">' + fill(x.s, '(　　　)', 'blank') + '</div>'
      + '<div class="ask">알맞은 표기를 고르세요</div>'
      + '<div class="opts two" id="o1">' + Q.o.map(function (o, i) { return '<button type="button" class="opt" data-i="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>'
      + '<div id="step2"></div><div id="res"></div><button type="button" class="go hide" id="go">다음</button>';
  } else {
    h += '<div class="qbox">' + oh(x.q) + '</div>' + bogi(x) + '<div class="opts' + (x.type === 'ox' ? ' ox' : '') + '" id="opts">'
      + x.opts.map(function (o, i) { return '<button type="button" class="opt" data-i="' + i + '">' + (x.type === 'ox' ? esc(o) : (i + 1) + '. ' + oh(o)) + '</button>'; }).join('')
      + '</div><div id="res"></div><button type="button" class="go hide" id="go">다음</button>';
  }
  $('qv').innerHTML = h + '</div>';
  if (Q.kind === 'card') {
    Array.prototype.forEach.call($('chips').children, function (b) {
      b.onclick = function () {
        var t = b.getAttribute('data-t'), on = b.getAttribute('aria-pressed') === 'true';
        b.setAttribute('aria-pressed', on ? 'false' : 'true');
        if (on) delete Q.picked[t]; else Q.picked[t] = 1;
        $('go').disabled = !Object.keys(Q.picked).length;
      };
    });
    $('go').onclick = function () { Q.graded ? next() : gradeCard(); };
    Q.graded = false;
  } else if (Q.kind === 'spell') {
    Array.prototype.forEach.call($('o1').children, function (b) { b.onclick = function () { spell1(+b.getAttribute('data-i')); }; });
    $('go').onclick = next;
  } else {
    Array.prototype.forEach.call($('opts').children, function (b) { b.onclick = function () { gradeConcept(+b.getAttribute('data-i')); }; });
    $('go').onclick = next;
  }
}
// 원문 속 앞뒤 어절을 함께 보여 준다
function ctx(c) {
  var i = CARDS.indexOf(c), a = CARDS[i - 1], b = CARDS[i + 1];
  return (a ? yy(a.f) + ' ' : '') + '<b style="color:var(--ink)">___</b>' + (b ? ' ' + yy(b.f) : '');
}
function gradeCard() {
  var c = Q.list[Q.i], miss = [], bad = [];
  Q.graded = true;
  $('qb').classList.add('done');
  Array.prototype.forEach.call($('chips').children, function (b) {
    var t = b.getAttribute('data-t'), on = !!Q.picked[t], ans = c.t.indexOf(t) >= 0;
    b.className = 'chip ' + (ans && on ? 'hit' : ans ? 'miss' : on ? 'bad' : '');
    if (ans && !on) miss.push(t);
    if (!ans && on) bad.push(t);
    var ts = S.tags[t] || (S.tags[t] = {seen: 0, hit: 0});
    ts.seen++; if (ans === on) ts.hit++;
  });
  var ok = !miss.length && !bad.length;
  if (ok) Q.right++;
  record(c, ok, {miss: miss, bad: bad});
  Q.log.push({q: '[어절] ' + c.f + ' (' + c.m + ')', ok: ok ? 1 : 0, pick: Object.keys(Q.picked).join(', '), ans: c.t.join(', ')});
  $('gl').className = 'g on';
  $('res').innerHTML = '<div class="res ' + (ok ? 'good' : 'poor') + '"><div class="hd">' + (ok ? '정확합니다' : '다시 볼 것') + '</div>'
    + (miss.length ? '<div><b class="miss-t">놓친 것</b> ' + miss.map(esc).join(', ') + '</div>' : '')
    + (bad.length ? '<div><b class="bad-t">아닌 것</b> ' + bad.map(esc).join(', ') + '</div>' : '')
    + '<div class="p">' + oh(c.p) + '</div><div style="margin-top:4px">' + oh(c.n) + '</div></div>';
  $('go').textContent = Q.i + 1 < Q.list.length ? '다음' : '결과 보기';
  $('go').disabled = false;
}
function gradeConcept(i) {
  var k = Q.list[Q.i], ok = i === k.a;
  $('qb').classList.add('done');
  Array.prototype.forEach.call($('opts').children, function (b, j) {
    if (j === k.a) b.classList.add('hit'); else if (j === i) b.classList.add('bad');
  });
  if (ok) Q.right++;
  record(k, ok, {pick: i});
  var tp = S.topics[k.topic] || (S.topics[k.topic] = {seen: 0, hit: 0}); tp.seen++; if (ok) tp.hit++;
  save();
  Q.log.push({q: '[개념] ' + k.q.slice(0, 60), ok: ok ? 1 : 0, pick: k.opts[i], ans: k.opts[k.a]});
  $('res').innerHTML = '<div class="res ' + (ok ? 'good' : 'poor') + '"><div class="hd">' + (ok ? '정답입니다' : '정답은 ' + (k.type === 'ox' ? esc(k.opts[k.a]) : (k.a + 1) + '번')) + '</div>' + oh(k.n) + '</div>';
  $('go').textContent = Q.i + 1 < Q.list.length ? '다음' : '결과 보기';
  $('go').className = 'go';
}
function bogi(x) { return x.box ? '<div class="bogi"><div class="bl">〈보기〉</div>' + oh(x.box).replace(/\n/g, '<br>') + '</div>' : ''; }
/* ---------- 바른 표기 고르기 ---------- */
function tagKey(x) { return x.t ? RULES[x.t].name : (x.cat || '그 밖의 표기'); }
function fill(s, w, cls) { return esc(s).replace('{}', '<b class="' + cls + '">' + esc(w) + '</b>'); }
function spell1(i) {
  var x = Q.list[Q.i];
  Q.p1 = Q.o[i];
  $('o1').classList.add('done');
  Array.prototype.forEach.call($('o1').children, function (b, j) {
    if (Q.o[j] === x.o[0]) b.classList.add('hit'); else if (j === i) b.classList.add('bad');
  });
  $('sent1').innerHTML = fill(x.s, x.o[0], 'filled');
  if (!x.t) return spellDone();
  // 오답 보기: 헷갈리기 쉬운 규정(near)을 먼저, 모자라면 같은 갈래에서 채운다. 함께 적용될 수 있는 규정(x)은 빼 둔다.
  var r = RULES[x.t], ban = [x.t].concat(x.x || []);
  var near = shuffle((r.near || []).filter(function (k) { return ban.indexOf(k) < 0; }));
  var rest = shuffle(Object.keys(RULES).filter(function (k) { return RULES[k].g === r.g && ban.indexOf(k) < 0 && near.indexOf(k) < 0; }));
  Q.r = shuffle([x.t].concat(near.concat(rest).slice(0, 3)));
  $('step2').innerHTML = '<div class="ask" style="margin-top:16px">이 표기에 적용된 한글 맞춤법 규정은?</div><div class="opts rules" id="o2">'
    + Q.r.map(function (k, j) { return '<button type="button" class="opt" data-i="' + j + '">' + esc(RULES[k].text) + '</button>'; }).join('') + '</div>';
  Array.prototype.forEach.call($('o2').children, function (b) { b.onclick = function () { spell2(+b.getAttribute('data-i')); }; });
}
function spell2(j) {
  var x = Q.list[Q.i];
  Q.p2 = Q.r[j];
  $('o2').classList.add('done');
  Array.prototype.forEach.call($('o2').children, function (b, k) {
    if (Q.r[k] === x.t) b.classList.add('hit'); else if (k === j) b.classList.add('bad');
  });
  spellDone();
}
function spellDone() {
  var x = Q.list[Q.i], ok1 = Q.p1 === x.o[0], ok2 = !x.t || Q.p2 === x.t, ok = ok1 && ok2;
  $('qb').classList.add('done');
  if (ok) Q.right++;
  record(x, ok, {p1: Q.p1, p2: Q.p2});
  var key = tagKey(x), ts = S.tags[key] || (S.tags[key] = {seen: 0, hit: 0}); ts.seen++; if (ok) ts.hit++;
  save();
  Q.log.push({q: '[표기] ' + x.s.replace('{}', '(' + x.o.join(' / ') + ')'), ok: ok ? 1 : 0,
    pick: Q.p1 + (x.t ? ' / ' + RULES[Q.p2].name : ''), ans: x.o[0] + (x.t ? ' / ' + RULES[x.t].name : '')});
  var hd = ok ? '정확합니다' : !ok1 ? '바른 표기는 ‘' + x.o[0] + '’' : '표기는 맞았지만 규정이 달라요';
  $('res').innerHTML = '<div class="res ' + (ok ? 'good' : 'poor') + '"><div class="hd">' + esc(hd) + '</div>'
    + (x.t ? '<div style="font-weight:700;color:var(--main)">' + esc(RULES[x.t].name) + '</div>' : '')
    + '<div style="margin-top:4px">' + esc(x.n) + '</div></div>';
  $('go').textContent = Q.i + 1 < Q.list.length ? '다음' : '결과 보기';
  $('go').className = 'go';
}
function spellNoteRow(x) {
  var l = S.cards[x.id].last || {};
  return '<div class="row"><div style="font-size:1rem">' + fill(x.s, x.o[0], 'filled') + '</div>'
    + (l.p1 && l.p1 !== x.o[0] ? '<div class="why"><b class="bad-t">고른 표기</b> ' + esc(l.p1) + '</div>' : '')
    + (x.t ? '<div class="why"><b class="miss-t">규정</b> ' + esc(RULES[x.t].text)
      + (l.p2 && l.p2 !== x.t ? '<div class="bad-t" style="margin-top:2px">고른 규정: ' + esc(RULES[l.p2].text) + '</div>' : '') + '</div>' : '')
    + '</div>';
}
function ruleTab() {
  var h = Object.keys(RULES).filter(function (k) { return !RULES[k].d; }).map(function (k) {
    var r = RULES[k], ex = QCARDS.filter(function (x) { return x.t === k; }).map(function (x) { return x.o[0]; });
    return '<div class="box note"><h4>' + esc(r.name) + ' <span style="font-weight:400;font-size:.78rem;color:var(--sub)">' + esc(r.ref || '') + '</span></h4><div style="font-size:.93rem;line-height:1.7">' + esc(r.text) + '</div>'
      + (ex.length ? '<div class="tg">' + ex.map(function (e) { return '<span>' + esc(e) + '</span>'; }).join('') + '</div>' : '') + '</div>';
  }).join('');
  var etc = QCARDS.filter(function (x) { return !x.t; });
  if (etc.length) h += '<div class="box note"><h4>그 밖에 자주 틀리는 표기</h4>' + etc.map(function (x) {
    return '<div class="r"><div class="k">' + esc(x.o[0]) + '</div><div>' + esc(x.n) + '</div></div>';
  }).join('') + '</div>';
  return h;
}

function next() { Q.i++; if (Q.i >= Q.list.length) return finish(); ask(); }
function finish() {
  var n = Q.list.length, r = Q.right, pct = n ? Math.round(r / n * 100) : 0;
  var missed = Q.list.filter(function (x, i) { return !Q.log[i].ok; });
  var say = pct === 100 ? '완벽해요!' : pct >= 70 ? '잘하고 있어요' : pct >= 40 ? '조금만 더 보면 돼요' : '틀린 것을 다시 풀어 봐요';
  var back = Q.kind === 'concept' ? function () { concept('note'); } : function () { work('note'); };
  var again = Q.kind === 'concept' ? function () { concept('quiz'); } : function () { work('quiz'); };
  if (Q.label === M.main.weak) again = weakRound;
  $('qv').innerHTML = '<div class="box fin"><div class="say">' + say + '</div><div class="big">' + r + ' / ' + n + '</div>'
    + '<div class="tip" style="margin:0">정답률 ' + pct + '%</div>'
    + (missed.length ? '<div class="misslist">' + missed.map(function (x) { return '<span>' + (Q.kind === 'card' ? yy(x.f) : Q.kind === 'spell' ? esc(x.o[0]) : esc(x.topic)) + '</span>'; }).join('') + '</div>' : '')
    + '<div class="sent" id="sent"></div>'
    + '<button type="button" class="go" id="again">한 판 더 (' + CONFIG.perRound + '문항)</button>'
    + '<button type="button" class="go sub" id="tonote">오답노트 보기</button>'
    + '<button type="button" class="go sub" id="tohome">처음으로</button></div>';
  $('again').onclick = again; $('tonote').onclick = back; $('tohome').onclick = home;
  report();
}

/* ---------- 구글 시트로 결과 보내기 ---------- */
function report() {
  if (!CONFIG.sheetUrl) return;
  G.outbox.push({sid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    school: G.me.school, week: CONFIG.week, name: G.me.name, area: Q.label,
    score: Q.right, total: Q.list.length, items: Q.log});
  save();
  $('sent').textContent = '결과를 보내는 중…';
  flush(function (ok) { if ($('sent')) $('sent').textContent = ok ? '선생님께 결과를 보냈어요.' : '지금은 보내지 못했어요. 다음에 접속하면 다시 보냅니다.'; });
}
function flush(cb) {
  if (!CONFIG.sheetUrl || !G.outbox.length) { if (cb) cb(true); return; }
  var left = G.outbox.length, allOk = true;
  G.outbox.slice().forEach(function (p) {
    fetch(CONFIG.sheetUrl, {method: 'POST', mode: 'no-cors', body: JSON.stringify(p)})
      .then(function () { G.outbox = G.outbox.filter(function (x) { return x.sid !== p.sid; }); save(); })
      .catch(function () { allOk = false; })
      .then(function () { if (--left === 0 && cb) cb(allOk); });
  });
}

drawZoom();
flush();
home();
</script>
